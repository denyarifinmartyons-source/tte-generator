<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator QR Code TTE Pegawai</title>
  <!-- Library QR Code Styling & html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h2>Generator QR Code TTE</h2>
    <p>Aplikasi Pembuat QR Code Tanda Tangan Elektronik Berlogo Instansi</p>
  </div>

  <div class="container">
    <!-- KOLOM KIRI: FORM INPUT DATA -->
    <div class="card">
      <h3>Data Pegawai</h3>
      
      <div class="form-group">
        <label for="nama">Nama Pegawai</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap">
      </div>

      <div class="form-group">
        <label for="nip">NIP / ID Pegawai</label>
        <input type="text" id="nip" placeholder="Masukkan NIP">
      </div>

      <div class="form-group">
        <label for="jabatan">Jabatan</label>
        <input type="text" id="jabatan" placeholder="Masukkan jabatan">
      </div>

      <div class="form-group">
        <label>Pilih Instansi</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="instansi" value="kemensos" checked>
            Sentra "Bahagia" di Medan
          </label>
          <label class="radio-label">
            <input type="radio" name="instansi" value="sekolah_rakyat">
            Sekolah Rakyat Menengah Pertama 2 Medan
          </label>
        </div>
      </div>

      <button type="button" class="btn btn-primary" onclick="generateQRCode()" style="width: 100%; margin-top: 15px;">
        Generate Barcode QR
      </button>
    </div>

    <!-- KOLOM KANAN: PRATINJAU QR CODE -->
    <div class="card" style="text-align: center;">
      <h3>Pratinjau QR Code</h3>
      
      <div id="preview-area">
        <!-- Hanya Elemen QR Code Ini Yang Akan Di-download -->
        <div id="qrcode-box" style="display: inline-block; padding: 15px; background: #ffffff; border-radius: 8px;"></div>

        <button type="button" class="btn btn-success" onclick="downloadQRCode()" style="width: 100%; margin-top: 25px;">
          Unduh Barcode (PNG)
        </button>
      </div>

      <div id="empty-state">
        <p style="color: #888; text-align: center; padding: 40px 0;">
          Silakan isi form di sebelah kiri lalu klik tombol <strong>Generate Barcode QR</strong>.
        </p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
